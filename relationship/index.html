            saveStateTimer: null,
            pendingPlayerResolve: null,
          };
          window.__mediaPlayerState = state;

          function parseYouTubeId(url) {
            try {
              const parsed = new URL(url, window.location.href);
              if (parsed.hostname.includes("youtu.be")) {
                return parsed.pathname.split("/").filter(Boolean)[0] || "";
              }
              if (parsed.pathname.startsWith("/embed/")) {
                return parsed.pathname.split("/")[2] || "";
              }
              if (parsed.pathname.startsWith("/shorts/")) {
                return parsed.pathname.split("/")[2] || "";
              }
              return parsed.searchParams.get("v") || "";
            } catch (_) {
              return "";
            }
          }

          function parseStartSeconds(url) {
            try {
              const parsed = new URL(url, window.location.href);
              const value = parsed.searchParams.get("t") || parsed.searchParams.get("start") || "";
              if (/^\d+$/.test(value)) return Number(value);
              const match = value.match(/(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?/);
              if (!match) return 0;
              return Number(match[1] || 0) * 3600 + Number(match[2] || 0) * 60 + Number(match[3] || 0);
            } catch (_) {
              return 0;
            }
          }

          function formatTime(seconds) {
            if (!seconds || !isFinite(seconds)) return "0:00";
            const total = Math.max(0, Math.floor(seconds));
            const mins = Math.floor(total / 60);
            const secs = total % 60;
            return `${mins}:${String(secs).padStart(2, "0")}`;
          }

          function normalizePlaylist(items) {
            if (!Array.isArray(items)) return [];
            return items
              .map(function (episode, index) {
                const url = episode.url || episode.youtubeUrl || "";
                const videoId = episode.videoId || parseYouTubeId(url);
                if (!videoId) return null;
                return {
                  title: episode.title || `Media ${index + 1}`,
                  source: episode.source || episode.host || "YouTube",
                  url: url || `https://www.youtube.com/watch?v=${videoId}`,
                  videoId,
                  start: Number(episode.start || parseStartSeconds(url)) || 0,
                };
              })
              .filter(Boolean);
          }

          function normalizePlaylistGroups(groups) {
            if (!Array.isArray(groups)) return [];
            return groups
              .map(function (group) {
                const tracks = normalizePlaylist(group.tracks);
                if (!group.key || !tracks.length) return null;
                return {
                  key: group.key,
                  label: group.label || group.key,
                  tracks,
                };
              })
              .filter(Boolean);
          }

          function findPlaylistGroup(mode) {
            return state.playlistGroups.find(function (group) {
              return group.key === mode;
            });
          }

          function syncPlaylistModeButton() {
            if (!source) return;
            const activeGroup = findPlaylistGroup(state.playlistMode);
            source.textContent = activeGroup ? activeGroup.label : "Featured";
            source.disabled = state.playlistGroups.length < 2;
            source.setAttribute(
              "aria-label",
              state.playlistGroups.length < 2 ? "Media playlist" : "Switch media playlist",
            );
            source.title = state.playlistGroups.length < 2 ? "Media playlist" : "Switch playlist";
          }

          function findPlaylistIndex(videoId) {
            return state.playlist.findIndex(function (episode) {
              return episode.videoId === videoId;
            });
          }

          function getActualPlaybackState() {
            if (
              state.ytPlayer &&
              typeof state.ytPlayer.getPlayerState === "function" &&
              window.YT &&
              window.YT.PlayerState
            ) {
              try {
                return state.ytPlayer.getPlayerState();
              } catch (_) {}
            }
            return null;
          }

          function isActuallyPlaying() {
            const actualState = getActualPlaybackState();
            if (actualState === null) return state.isPlaying;
            return actualState === window.YT.PlayerState.PLAYING;
          }

          function syncButtons() {
            syncPlaylistModeButton();
            state.isPlaying = isActuallyPlaying();
            if (toggle) {
              toggle.disabled = !state.currentTrack;
              toggle.setAttribute("aria-label", state.isPlaying ? "Pause media" : "Play media");
              toggle.title = state.isPlaying ? "Pause" : "Play";
            }
            if (toggleIcon) toggleIcon.textContent = state.isPlaying ? "II" : "▶";
            if (prev) prev.disabled = state.playlist.length === 0;
            if (next) next.disabled = state.playlist.length === 0;
            if (backward) backward.disabled = !state.currentTrack;
            if (forward) forward.disabled = !state.currentTrack;
          }

          function saveMediaState() {
            if (!state.currentTrack) return;
            state.isPlaying = isActuallyPlaying();
            let currentTime = 0;
            if (state.ytPlayer && typeof state.ytPlayer.getCurrentTime === "function") {
              try {
                currentTime = state.ytPlayer.getCurrentTime();
              } catch (_) {}
            }
            localStorage.setItem("media:state", JSON.stringify({
              videoId: state.currentTrack.videoId,
              url: state.currentTrack.url,
              start: state.currentTrack.start,
              title: state.currentTrack.title,
              source: state.currentTrack.source,
              playlistMode: state.playlistMode,
              currentTime: currentTime || state.currentTrack.start,
              isPlaying: state.isPlaying,
            }));
          }

          if (!window.__mediaPlayerBeforeSwapSaveAttached) {
            window.__mediaPlayerBeforeSwapSaveAttached = true;
            document.addEventListener("astro:before-swap", saveMediaState);
          }

          let saveStateTimer = state.saveStateTimer;
          function startSaveStateTimer() {
            stopSaveStateTimer();
            saveStateTimer = window.setInterval(saveMediaState, 2000);
            state.saveStateTimer = saveStateTimer;
          }
          function stopSaveStateTimer() {
            if (saveStateTimer) {
              window.clearInterval(saveStateTimer);
              saveStateTimer = null;
              state.saveStateTimer = null;
            }
          }

          function updateProgressUI(current, total) {
            const percent = total > 0 && isFinite(total) ? Math.max(0, Math.min(100, (current / total) * 100)) : 0;
            if (progress) progress.style.width = `${percent}%`;
            if (seek) seek.setAttribute("aria-valuenow", String(Math.round(percent)));
            if (currentTime) currentTime.textContent = formatTime(current);
            if (duration) duration.textContent = formatTime(total);
          }

          function stopProgressTimer() {
            if (state.progressTimer) {
              window.clearInterval(state.progressTimer);
              state.progressTimer = null;
            }
          }

          function startProgressTimer() {
            stopProgressTimer();
            state.progressTimer = window.setInterval(function () {
              if (!state.ytPlayer || typeof state.ytPlayer.getCurrentTime !== "function") return;
              try {
                updateProgressUI(state.ytPlayer.getCurrentTime(), state.ytPlayer.getDuration());
              } catch (_) {}
            }, 500);
          }

          function ensureYouTubeApi() {
            if (window.YT && window.YT.Player) return Promise.resolve();
            if (window.__youtubeApiPromise) return window.__youtubeApiPromise;

            window.__youtubeApiPromise = new Promise(function (resolve) {
              const previousReady = window.onYouTubeIframeAPIReady;
              window.onYouTubeIframeAPIReady = function () {
                if (typeof previousReady === "function") previousReady();
                resolve();
              };
              const script = document.createElement("script");
              script.src = "https://www.youtube.com/iframe_api";
              script.async = true;
              document.head.appendChild(script);
            });
            return window.__youtubeApiPromise;
          }

          function destroyYouTubePlayer() {
            if (state.ytPlayer && typeof state.ytPlayer.destroy === "function") {
              try {
                state.ytPlayer.destroy();
              } catch (_) {}
            }
            state.ytPlayer = null;
            state.apiReady = false;
            stopProgressTimer();
          }

          function attachYouTubePlayer(iframe) {
            if (!iframe) return;
            ensureYouTubeApi().then(function () {
              try {
                if (
                  state.ytPlayer &&
                  typeof state.ytPlayer.getIframe === "function" &&
                  state.ytPlayer.getIframe() === iframe

                  state.apiReady = true;
                  startProgressTimer();
                  syncButtons();
                  if (state.resumeRequested && typeof state.ytPlayer.playVideo === "function") {

                  const oldIframe = state.ytPlayer.getIframe();

                events: {
                  onReady: function () {
                    state.apiReady = true;
                    startProgressTimer();
                    syncButtons();
                    if (state.resumeRequested) {
                      try {
                        state.ytPlayer.playVideo();
                      } catch (_) {}
                    }

                  onStateChange: function (event) {
                    state.isPlaying = event.data === window.YT.PlayerState.PLAYING;
                    if (
                      event.data === window.YT.PlayerState.PLAYING ||
                      event.data === window.YT.PlayerState.PAUSED ||
                      event.data === window.YT.PlayerState.CUED ||
                      event.data === window.YT.PlayerState.ENDED

                      state.resumeRequested = false;
                    }
                    if (event.data === window.YT.PlayerState.ENDED) {
                      playAdjacent(1);
                    }
                    syncButtons();
                    saveMediaState();
                  },
                },
              });
            });
          }

          function reattachYouTubePlayer() {
            const iframe = document.getElementById("sidebar-media-iframe");
            if (!iframe || !state.currentTrack) return;

            let stillAttached = false;
            try {
              stillAttached =
                state.ytPlayer &&
                typeof state.ytPlayer.getIframe === "function" &&
                state.ytPlayer.getIframe() === iframe;
            } catch (_) {}

            if (stillAttached) {
              syncButtons();
              startSaveStateTimer();
              return;
            }

            attachYouTubePlayer(iframe);
          }

          if (!window.__mediaPlayerPageLoadAttached) {
            window.__mediaPlayerPageLoadAttached = true;
            document.addEventListener("astro:page-load", reattachYouTubePlayer);
          }

          function renderMedia(episode, options) {
            const videoId = episode.videoId || parseYouTubeId(episode.url || "");
            if (!videoId) return false;

            // If the same video is already loaded, don't recreate the iframe.
            if (
              state.currentTrack &&
              state.currentTrack.videoId === videoId &&
              document.getElementById("sidebar-media-iframe")
            ) {
              state.resumeRequested = Boolean(options && options.autoplay);
              state.isPlaying = isActuallyPlaying();
              if (options && options.autoplay && state.ytPlayer && typeof state.ytPlayer.playVideo === "function") {
                try {
                  state.ytPlayer.playVideo();
                } catch (_) {}
              } else {
                reattachYouTubePlayer();
              }
              syncButtons();
              startSaveStateTimer();
              saveMediaState();
              return true;
            }

            const autoplay = options && options.autoplay ? "1" : "0";
            const start = Number(
              options && options.start !== undefined
                ? options.start
                : (episode.start || parseStartSeconds(episode.url || "")),
            ) || 0;
            const startParam = start > 0 ? `&start=${Math.floor(start)}` : "";
            const originParam = `&origin=${encodeURIComponent(window.location.origin)}`;
            const embedUrl = `https://www.youtube-nocookie.com/embed/${encodeURIComponent(videoId)}?autoplay=${autoplay}&enablejsapi=1&playsinline=1&controls=0&disablekb=1&fs=0&iv_load_policy=3&showinfo=0&rel=0&modestbranding=1${startParam}${originParam}`;
            destroyYouTubePlayer();
            embed.innerHTML = `<iframe id="sidebar-media-iframe" src="${embedUrl}" title="${episode.title || "Media item"}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen loading="lazy"></iframe>`;
            title.textContent = episode.title || "Untitled media";
            syncPlaylistModeButton();
            player.hidden = false;
            window.__mediaPlayerHasTrack = true;
            state.currentTrack = {
              videoId,
              url: episode.url || `https://www.youtube.com/watch?v=${videoId}`,
              start,
              title: title.textContent,
              source: source.textContent,
            };
            const matchedIndex = findPlaylistIndex(videoId);
            if (matchedIndex >= 0) state.currentIndex = matchedIndex;
            state.resumeRequested = autoplay === "1";
            state.isPlaying = false;
            updateProgressUI(start, 0);
            syncButtons();
            saveMediaState();
            startSaveStateTimer();
            document.dispatchEvent(new CustomEvent("media:playing", { detail: { videoId } }));
            attachYouTubePlayer(document.getElementById("sidebar-media-iframe"));
            return true;
          }

          function playAtIndex(index, options) {
            if (!state.playlist.length) return false;
            const normalizedIndex = (index + state.playlist.length) % state.playlist.length;
            state.currentIndex = normalizedIndex;
            return renderMedia(state.playlist[normalizedIndex], options || { autoplay: true });
          }

          function playAdjacent(offset) {
            if (!state.playlist.length) return false;
            const current = state.currentIndex >= 0 ? state.currentIndex : findPlaylistIndex(state.currentTrack?.videoId);
            return playAtIndex((current >= 0 ? current : 0) + offset, { autoplay: true });
          }

          window.playMedia = function (episode) {
            return renderMedia(episode || {}, { autoplay: true });
          };

          window.setMediaPlaylist = function (episodes) {
            const normalized = normalizePlaylist(episodes);
            state.playlist = normalized;
            if (state.currentTrack) {
              state.currentIndex = findPlaylistIndex(state.currentTrack.videoId);
            }
            syncButtons();
          };

          function setMediaPlaylistMode(mode, options) {
            const targetGroup = findPlaylistGroup(mode) || state.playlistGroups[0];
            if (!targetGroup) return false;
            state.playlistMode = targetGroup.key;
            state.playlist = targetGroup.tracks;
            state.currentIndex = state.currentTrack ? findPlaylistIndex(state.currentTrack.videoId) : -1;
            syncButtons();

            if (options && options.play) {
              if (state.currentIndex >= 0 && options.keepCurrent !== false) {
                return true;
              }
              return playAtIndex(0, { autoplay: true });
            }
            return true;
          }

          window.setMediaPlaylistGroups = function (groups) {
            const normalized = normalizePlaylistGroups(groups);
            if (!normalized.length) return false;
            state.playlistGroups = normalized;
            return setMediaPlaylistMode(state.playlistMode || normalized[0].key, { keepCurrent: true });
          };

          window.setMediaPlaylistMode = function (mode, options) {
            return setMediaPlaylistMode(mode, options || { keepCurrent: true });
          };

          window.seedMediaPlayer = function (episodes) {
            window.setMediaPlaylist(episodes);
            if (window.__mediaPlayerHasTrack) return false;
            if (!state.playlist.length) return false;
            return playAtIndex(Math.floor(Math.random() * state.playlist.length), { autoplay: false });
          };

          window.setMediaPlaylistGroups(mediaPlaylistGroups);

          function bindMediaControls() {
            if (source) {
              source.onclick = function () {
                if (!state.playlistGroups.length) return;
                const current = state.playlistGroups.findIndex(function (group) {
                  return group.key === state.playlistMode;
                });
                const nextGroup = state.playlistGroups[(Math.max(0, current) + 1) % state.playlistGroups.length];
                setMediaPlaylistMode(nextGroup.key, { play: true, keepCurrent: true });
              };
            }

            if (toggle) {
              toggle.onclick = function () {
                if (!state.currentTrack) return;
                if (!state.ytPlayer || typeof state.ytPlayer.playVideo !== "function") {
                  renderMedia(state.currentTrack, { autoplay: true });
                  return;
                }
                try {
                  if (isActuallyPlaying()) {
                    state.ytPlayer.pauseVideo();
                  } else {
                    state.resumeRequested = false;
                    state.ytPlayer.playVideo();
                  }
                } catch (_) {}
              };
            }

            if (prev) {
              prev.onclick = function () {
                playAdjacent(-1);
              };
            }

            if (next) {
              next.onclick = function () {
                playAdjacent(1);
              };
            }

            function skipSeconds(delta) {
              if (!state.ytPlayer || typeof state.ytPlayer.seekTo !== "function") return;
              const total = state.ytPlayer.getDuration();
              if (!total || !isFinite(total)) return;
              const current = state.ytPlayer.getCurrentTime();
              state.ytPlayer.seekTo(Math.max(0, Math.min(total, current + delta)), true);
              saveMediaState();
            }

            if (backward) {
              backward.onclick = function () {
                skipSeconds(-15);
              };
            }

            if (forward) {
              forward.onclick = function () {
                skipSeconds(15);
              };
            }

            if (seek) {
              seek.onclick = function (event) {
                if (!state.ytPlayer || typeof state.ytPlayer.seekTo !== "function") return;
                const total = state.ytPlayer.getDuration();
                if (!total || !isFinite(total)) return;
                const rect = seek.getBoundingClientRect();
                const ratio = Math.max(0, Math.min(1, (event.clientX - rect.left) / rect.width));
                state.ytPlayer.seekTo(ratio * total, true);
                saveMediaState();
              };
              seek.onkeydown = function (event) {
                if (!state.ytPlayer || typeof state.ytPlayer.seekTo !== "function") return;
                const total = state.ytPlayer.getDuration();
                if (!total || !isFinite(total)) return;
                const current = state.ytPlayer.getCurrentTime();
                let nextTime = current;
                if (event.key === "ArrowRight" || event.key === "ArrowUp") nextTime = current + 10;
                else if (event.key === "ArrowLeft" || event.key === "ArrowDown") nextTime = current - 10;
                else if (event.key === "Home") nextTime = 0;
                else if (event.key === "End") nextTime = total;
                else return;
                event.preventDefault();
                state.ytPlayer.seekTo(Math.max(0, Math.min(total, nextTime)), true);
                saveMediaState();
              };
            }
          }

          bindMediaControls();

          // On subsequent Astro transitions, only reattach the existing player.
          if (window.__mediaPlayerInitialized) {
            reattachYouTubePlayer();
            syncButtons();
            if (state.currentTrack) {
              document.dispatchEvent(
                new CustomEvent("media:playing", { detail: { videoId: state.currentTrack.videoId } }),
              );
            }
            return;
          }

          // First initialization only: restore from storage or auto-seed.
          const saved = localStorage.getItem("media:state") || localStorage.getItem("media:last");
          let restoredFromStorage = false;
          if (!window.__mediaPlayerHasTrack && saved && saved !== "null") {
            try {
              const savedState = JSON.parse(saved);
              if (savedState.playlistMode) {
                setMediaPlaylistMode(savedState.playlistMode, { keepCurrent: true });
              }
              restoredFromStorage = renderMedia(savedState, {
                autoplay: savedState.isPlaying !== false,
                start: savedState.currentTime || savedState.start,
              });
              if (!restoredFromStorage) localStorage.removeItem("media:state");
            } catch (_) {
              localStorage.removeItem("media:state");
            }
          }

          if (restoredFromStorage) {
            window.__mediaPlayerInitialized = true;
            return;
          }

          if (window.__mediaPlayerHasTrack) {
            syncButtons();
            const iframe = document.getElementById("sidebar-media-iframe");
            if (iframe && !state.ytPlayer) attachYouTubePlayer(iframe);
            if (state.currentTrack) startSaveStateTimer();
          } else if (state.playlist.length) {
            playAtIndex(Math.floor(Math.random() * state.playlist.length), { autoplay: true });
          }

          window.__mediaPlayerInitialized = true;

          if (!window.__mediaPlayerBeforeUnloadAttached) {
            window.__mediaPlayerBeforeUnloadAttached = true;
            window.addEventListener("beforeunload", saveMediaState);
          }
        })();

        document.addEventListener("DOMContentLoaded", initLayout);
        if (!window.__mediaPlayerMountListenersAttached) {
          window.__mediaPlayerMountListenersAttached = true;
          document.addEventListener("astro:before-swap", cacheMediaPlayerElement);
          document.addEventListener("astro:after-swap", ensureMediaPlayerMounted);
        }
        document.addEventListener("astro:after-swap", applyStoredTheme);
        document.addEventListener("astro:page-load", function () {
          ensureMediaPlayerMounted();
          initLayout();
        });
        initLayout();
      })();
    })();</script> </body> </html>
