name: Deploy site

concurrency:
  group: deploy-site-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - master
      - main
    paths:
      - "public/**"
      - "src/**"
      - "**.mjs"
      - "**/*.md"
      - "**.yml"
      - "package.json"
      - "package-lock.json"
      - "astro.config.mjs"
  pull_request:
    branches:
      - master
      - main
    paths:
      - "public/**"
      - "src/**"
      - "**.mjs"
      - "**/*.md"
      - "**.yml"
      - "package.json"
      - "package-lock.json"
      - "astro.config.mjs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Deploy
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
