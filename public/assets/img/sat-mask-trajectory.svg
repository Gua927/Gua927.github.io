    <circle cx="535" cy="278" r="8"/>
    <circle cx="705" cy="248" r="8"/>
    <circle cx="850" cy="225" r="8"/>
    <circle cx="190" cy="472" r="8"/>
    <circle cx="360" cy="465" r="8"/>
    <circle cx="535" cy="430" r="8"/>
    <circle cx="705" cy="385" r="8"/>
    <circle cx="850" cy="390" r="8"/>
  </g>
  <g fill="#171717" font-family="JetBrains Mono, Consolas, monospace" font-size="12">
    <text x="162" y="535">over-noise</text>
    <text x="430" y="535">margin denoise</text>
    <text x="710" y="535">easy to hard</text>
  </g>
  <g stroke="#171717" stroke-width="1.5">
    <line x1="250" y1="520" x2="390" y2="520"/>
    <line x1="390" y1="520" x2="382" y2="514"/>
    <line x1="390" y1="520" x2="382" y2="526"/>
